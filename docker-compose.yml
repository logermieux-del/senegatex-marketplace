version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: senegatex-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/senegatex
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-in-production
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
    command: npm run dev
    networks:
      - senegatex

  db:
    image: postgres:15-alpine
    container_name: senegatex-db
    environment:
      POSTGRES_DB: senegatex
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - senegatex

  redis:
    image: redis:7-alpine
    container_name: senegatex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - senegatex

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: senegatex-search
    environment:
      MEILI_MASTER_KEY: DebugKey1234567890
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilisearch_data:/meili_data
    networks:
      - senegatex

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:

networks:
  senegatex:
    driver: bridge
