name: Performance & Bundle Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 0 * * 0' # Weekly

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    name: Lighthouse Performance Check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Start server
        run: npm start > /tmp/server.log 2>&1 &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:3000 > /dev/null; then
              echo "✅ Server ready"
              exit 0
            fi
            echo "⏳ Waiting for server... ($i/30)"
            sleep 2
          done
          exit 1

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@v10
        with:
          configPath: './.github/lighthouse/lighthouserc.json'
          uploadArtifacts: true
          temporaryPublicStorage: true

  bundle-analysis:
    runs-on: ubuntu-latest
    name: Bundle Size Analysis

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

      - name: Analyze bundle
        run: |
          echo "=== Build Output ==="
          du -sh .next
          echo ""
          echo "=== Next.js Build Analysis ==="
          find .next -type f -name "*.js" | sort -k1 -hr | head -20

      - name: Check bundle size
        run: |
          BUNDLE_SIZE=$(du -sb .next | cut -f1)
          LIMIT=$((600 * 1024 * 1024)) # 600MB limit

          if [ $BUNDLE_SIZE -gt $LIMIT ]; then
            echo "❌ Bundle size exceeds limit"
            echo "Size: $(($BUNDLE_SIZE / 1024 / 1024))MB (limit: 600MB)"
            exit 1
          fi
          echo "✅ Bundle size OK: $(($BUNDLE_SIZE / 1024 / 1024))MB"

  dependency-check:
    runs-on: ubuntu-latest
    name: Dependency Check

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check for outdated packages
        run: npm outdated || true

      - name: License check
        run: npm run license:check || true
