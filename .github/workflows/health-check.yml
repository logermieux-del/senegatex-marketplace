name: Health Check Monitoring

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest
    name: API Health Check

    steps:
      - uses: actions/checkout@v4

      - name: Check staging environment
        continue-on-error: true
        run: |
          STAGING_URL="https://staging.yembal.sn"
          echo "Checking $STAGING_URL..."

          # Health check endpoint
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$STAGING_URL/api/health")
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Staging health check passed"
          else
            echo "❌ Staging health check failed: HTTP $RESPONSE"
            exit 1
          fi

      - name: Check production environment
        continue-on-error: true
        run: |
          PROD_URL="https://yembal.sn"
          echo "Checking $PROD_URL..."

          # Health check endpoint
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/api/health")
          if [ "$RESPONSE" = "200" ]; then
            echo "✅ Production health check passed"
          else
            echo "❌ Production health check failed: HTTP $RESPONSE"
            exit 1
          fi

      - name: Check database connectivity
        continue-on-error: true
        run: |
          echo "Database health check would run here"
          echo "(Requires database access credentials)"

      - name: Notify on failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: '❌ Health check failed'
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow

  uptime-monitor:
    runs-on: ubuntu-latest
    name: Uptime Monitoring

    steps:
      - name: Check response times
        run: |
          echo "=== Response Time Check ==="

          URLS=(
            "https://yembal.sn"
            "https://yembal.sn/api/listings"
            "https://yembal.sn/api/search"
          )

          for url in "${URLS[@]}"; do
            start=$(date +%s%N)
            curl -s -o /dev/null -w "%{http_code}" "$url"
            end=$(date +%s%N)
            duration=$(( (end - start) / 1000000 ))
            echo "$url: ${duration}ms"

            if [ $duration -gt 5000 ]; then
              echo "⚠️  Warning: Response time exceeds 5s"
            fi
          done

      - name: Check SSL certificate expiration
        run: |
          echo "=== SSL Certificate Check ==="
          echo "Certificate expiration check would run here"
          # Example: check-ssl-cert -d yembal.sn

  synthetic-tests:
    runs-on: ubuntu-latest
    name: Synthetic Monitoring

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install

      - name: Run smoke tests
        continue-on-error: true
        run: |
          echo "Running synthetic smoke tests..."
          # npm run test:smoke || true

      - name: Check critical user flows
        continue-on-error: true
        run: |
          echo "Critical user flow checks:"
          echo "- Homepage loads"
          echo "- Search functionality works"
          echo "- Listing detail pages load"
          echo "- Message API responds"
          echo "- Notification API responds"
