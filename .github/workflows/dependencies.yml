name: Dependency Updates

on:
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 2 AM
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    name: Check & Update Dependencies

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Update npm
        run: npm install -g npm@latest

      - name: Check for updates
        id: check
        run: |
          npm outdated > /tmp/outdated.txt || true

          if [ -s /tmp/outdated.txt ]; then
            echo "has_updates=true" >> $GITHUB_OUTPUT
            cat /tmp/outdated.txt
          else
            echo "has_updates=false" >> $GITHUB_OUTPUT
            echo "All dependencies are up to date"
          fi

      - name: Update dependencies
        if: steps.check.outputs.has_updates == 'true'
        run: npm update --save

      - name: Install security updates
        run: npm audit fix --legacy-peer-deps || true

      - name: Run tests
        run: npm run test -- --run || true

      - name: Commit changes
        if: steps.check.outputs.has_updates == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore(deps): update dependencies'
          commit_options: '--no-verify'
          file_pattern: 'package.json package-lock.json'

      - name: Create Pull Request
        if: steps.check.outputs.has_updates == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore(deps): update dependencies'
          title: '🔄 Automated Dependency Updates'
          body: |
            ## Dependency Updates

            Automated weekly dependency check and updates.

            ### Changed Packages
            ```
            ${{ steps.check.outputs.outdated }}
            ```

            ### Checklist
            - [ ] Review changes
            - [ ] Verify tests pass
            - [ ] Check for breaking changes
          branch: chore/update-dependencies
          delete-branch: true
          labels: 'dependencies, automated'
